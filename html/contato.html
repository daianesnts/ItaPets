<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="../img/favicon.webp" rel="icon" type="favicon/webp" />
    <link rel="stylesheet" href="../css/style_contato.css">
    <title>ItaPets - Contato e Comentários</title>
</head>

<body>

    <header>
        <img src="../img/logo-loja-produtos-pet-itapets-navegacao.webp" alt="Logo ItaPets" width="100">
        <p>Tudo o que seu pet precisa em um só lugar!</p>
        <nav>
            <ul>
                <li><a href="../index.html">Início</a></li>
                <li><a href="contato.html">Fale Conosco</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Envie seu Comentário</h1>

        <form action="mailto:daidai.santos@hotmail.com" method="post" enctype="text/plain">

            <fieldset>
                <legend>Seus dados:</legend>
                <div class="row g-3">
                    <div class="col-12 col-md-8">
                        <label class="form-label" for="nome">Nome Completo:</label>
                        <input class="form-control" type="text" id="nome" name="Nome" required
                            placeholder="Digite seu nome">
                    </div>
                    <div class="col-12 col-md-4">
                        <label class="form-label" for="telefone">Telefone:</label>
                        <input class="form-control" type="tel" id="telefone" name="Telefone" required
                            placeholder="(00) 00000-0000">
                    </div>
                    <div class="col-12">
                        <label class="form-label" for="email">E-mail:</label>
                        <input class="form-control" type="email" id="email" name="Email" required
                            placeholder="seuemail@gmail.com">
                    </div>
                </div>
            </fieldset>

            <fieldset>
                <legend>Selecione o tipo de comentário:</legend>
                <div class="row g-2 mt-1">
                    <div class="col-auto">
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="checkbox" name="TipoComentario" id="tipo-elogio"
                                value="elogio">
                            <label class="form-check-label" for="tipo-elogio">Elogio</label>
                        </div>
                    </div>
                    <div class="col-auto">
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="checkbox" name="TipoComentario" id="tipo-sugestao"
                                value="sugestao">
                            <label class="form-check-label" for="tipo-sugestao">Sugestão</label>
                        </div>
                    </div>
                    <div class="col-auto">
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="checkbox" name="TipoComentario" id="tipo-reclamacao"
                                value="reclamacao">
                            <label class="form-check-label" for="tipo-reclamacao">Reclamação</label>
                        </div>
                    </div>
                    <div class="col-auto">
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="checkbox" name="TipoComentario" id="tipo-suporte"
                                value="suporte">
                            <label class="form-check-label" for="tipo-suporte">Suporte</label>
                        </div>
                    </div>
                </div>
            </fieldset>

            <fieldset>
                <legend>Comentários sobre o site:</legend>
                <div class="row g-3 mt-1">
                    <div class="col-12">
                        <label class="form-label" for="comentario">Mensagem:</label>
                        <textarea class="form-control" id="comentario" name="Comentario" rows="6" required
                            placeholder="Deixe um comentário para nós..."></textarea>
                    </div>
                </div>
            </fieldset>

            <fieldset>
                <legend>De 0 a 10, quanto você recomendaria o ItaPets?</legend>
                <div class="row g-2 mt-1">
                    <div class="col-auto">
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="Nota" id="nota-0" value="0" required>
                            <label class="form-check-label" for="nota-0">0</label>
                        </div>
                    </div>
                    <div class="col-auto">
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="Nota" id="nota-1" value="1">
                            <label class="form-check-label" for="nota-1">1</label>
                        </div>
                    </div>
                    <div class="col-auto">
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="Nota" id="nota-2" value="2">
                            <label class="form-check-label" for="nota-2">2</label>
                        </div>
                    </div>
                    <div class="col-auto">
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="Nota" id="nota-3" value="3">
                            <label class="form-check-label" for="nota-3">3</label>
                        </div>
                    </div>
                    <div class="col-auto">
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="Nota" id="nota-4" value="4">
                            <label class="form-check-label" for="nota-4">4</label>
                        </div>
                    </div>
                    <div class="col-auto">
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="Nota" id="nota-5" value="5">
                            <label class="form-check-label" for="nota-5">5</label>
                        </div>
                    </div>
                    <div class="col-auto">
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="Nota" id="nota-6" value="6">
                            <label class="form-check-label" for="nota-6">6</label>
                        </div>
                    </div>
                    <div class="col-auto">
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="Nota" id="nota-7" value="7">
                            <label class="form-check-label" for="nota-7">7</label>
                        </div>
                    </div>
                    <div class="col-auto">
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="Nota" id="nota-8" value="8">
                            <label class="form-check-label" for="nota-8">8</label>
                        </div>
                    </div>
                    <div class="col-auto">
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="Nota" id="nota-9" value="9">
                            <label class="form-check-label" for="nota-9">9</label>
                        </div>
                    </div>
                    <div class="col-auto">
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="Nota" id="nota-10" value="10">
                            <label class="form-check-label" for="nota-10">10</label>
                        </div>
                    </div>
                </div>
            </fieldset>

            <div class="row mt-2">
                <div class="col-12 col-md-4">
                    <input type="submit" value="Enviar Comentário">
                </div>
            </div>

        </form>
    </main>

    <footer>
        <img src="../img/logo-loja-produtos-pet-itapets-navegacao.webp" alt="Logo ItaPets" width="100">

        <nav aria-label="Navegação do rodapé">
            <a href="../index.html">Início</a>
            <a href="../index.html#cachorro">Produtos</a>
            <a href="contato.html">Contato</a>
        </nav>

        <p>
            &copy; 2026 ItaPets - Todos os Direitos Reservados.
        </p>
    </footer>

</body>

</html>
