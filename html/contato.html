<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ItaPets - Contato e Comentários</title>
</head>

<body>

    <header>
        <h1>ItaPets - Envie seu Comentário</h1>
        <nav>
            <a href="../index.html">Voltar para a Página Inicial</a>
        </nav>
    </header>

    <main>
        <h2>Fale Conosco</h2>
        <form action="mailto:daidai.santos@hotmail.com" method="post" enctype="text/plain">
            <label for="nome">Nome Completo:</label><br>
            <input type="text" id="nome" name="Nome" required placeholder="Digite seu nome"><br><br>
            <label for="email">E-mail:</label><br>
            <input type="email" id="email" name="Email" required placeholder="seuemail@gmail.com"><br><br>
            <label for="telefone">Telefone:</label><br>
            <input type="tel" id="telefone" name="Telefone" required placeholder="(00) 00000-0000"><br><br>

            <legend>Selecione o tipo de comentário:</legend><br>
            <label><input type="checkbox" name="TipoComentario" value="elogio"> Elogio</label><br>
            <label><input type="checkbox" name="TipoComentario" value="sugestao"> Sugestão</label><br>
            <label><input type="checkbox" name="TipoComentario" value="reclamacao"> Reclamação</label><br>
            <label><input type="checkbox" name="TipoComentario" value="suporte"> Suporte</label><br><br>

            <label for="comentario">Comentários sobre o site:</label><br>
            <textarea id="comentario" name="Comentario" rows="6" cols="40" required
                placeholder="Deixe um comentário para nós..."></textarea><br>

            <br><legend>De 0 a 10, quanto você recomendaria o ItaPets?</legend><br>
            <label><input type="radio" name="Nota" value="0" required> 0</label>
            <label><input type="radio" name="Nota" value="1"> 1</label>
            <label><input type="radio" name="Nota" value="2"> 2</label>
            <label><input type="radio" name="Nota" value="3"> 3</label>
            <label><input type="radio" name="Nota" value="4"> 4</label>
            <label><input type="radio" name="Nota" value="5"> 5</label>
            <label><input type="radio" name="Nota" value="6"> 6</label>
            <label><input type="radio" name="Nota" value="7"> 7</label>
            <label><input type="radio" name="Nota" value="8"> 8</label>
            <label><input type="radio" name="Nota" value="9"> 9</label>
            <label><input type="radio" name="Nota" value="10"> 10</label><br><br>

            <input type="submit" value="Enviar Comentário">

        </form>
    </main>

    <footer>
        <br>&copy; 2023 ItaPets - Todos os direitos reservados.
    </footer>

</body>


</html>
