<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" href="../img/favicon.png" type="image/x-icon">
    <title>ItaPets - Contato e Comentários</title>
</head>

<body>

    <header>
        <h1>ItaPets - Envie seu Comentário</h1>
        <nav>
            <a href="../index.html">Voltar para a Página Inicial</a>
        </nav>
    </header>

    <main>
        <h2>Fale Conosco</h2>
        <form action="mailto:daidai.santos@hotmail.com" method="post" enctype="text/plain">
            <fieldset>
                <legend>Seus dados:</legend>
                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" name="Nome" required placeholder="Digite seu nome">
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="Email" required placeholder="seuemail@gmail.com">
                <label for="telefone">Telefone:</label>
                <input type="tel" id="telefone" name="Telefone" required placeholder="(00) 00000-0000">
            </fieldset>

            <fieldset>
                <legend>Selecione o tipo de comentário:</legend>
                <label><input type="checkbox" name="TipoComentario" value="elogio">Elogio</label>
                <label><input type="checkbox" name="TipoComentario" value="sugestao">Sugestão</label>
                <label><input type="checkbox" name="TipoComentario" value="reclamacao">Reclamação</label>
                <label><input type="checkbox" name="TipoComentario" value="suporte">Suporte</label>
            </fieldset>

            <fieldset>
                <legend>Comentários sobre o site:</legend>
                <textarea id="comentario" name="Comentario" rows="6" cols="40" required
                    placeholder="Deixe um comentário para nós..."></textarea>
            </fieldset>

            <fieldset>
                <legend>De 0 a 10, quanto você recomendaria o ItaPets?</legend>
                <label><input type="radio" name="Nota" value="0" required> 0</label>
                <label><input type="radio" name="Nota" value="1"> 1</label>
                <label><input type="radio" name="Nota" value="2"> 2</label>
                <label><input type="radio" name="Nota" value="3"> 3</label>
                <label><input type="radio" name="Nota" value="4"> 4</label>
                <label><input type="radio" name="Nota" value="5"> 5</label>
                <label><input type="radio" name="Nota" value="6"> 6</label>
                <label><input type="radio" name="Nota" value="7"> 7</label>
                <label><input type="radio" name="Nota" value="8"> 8</label>
                <label><input type="radio" name="Nota" value="9"> 9</label>
                <label><input type="radio" name="Nota" value="10"> 10</label>
            </fieldset>

            <br><input type="submit" value="Enviar Comentário">

        </form>
    </main>

    <footer>
        <img src="../img/logo-loja-produtos-pet-itapets-navegacao.webp" alt="Logo ItaPets" class="footer-logo"
            width="100">

        <nav class="footer-nav" aria-label="Navegação do rodapé">
            <a href="../index.html">Início</a>
            <a href="../index.html#cachorro">Produtos</a>
            <a href="contato.html">Contato</a>
        </nav>

        <p class="footer-bottom">
            &copy; 2026 ItaPets - Todos os Direitos Reservados.
        </p>
    </footer>

</body>


</html>
